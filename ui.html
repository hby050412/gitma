<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编号标注</title>
  <style>
    /* ═══════════════════════════════════════
       全局重置 & 变量
       ═══════════════════════════════════════ */
    :root {
      --blue: #4A90D9;
      --blue-hover: #3A7BC8;
      --blue-light: #EBF2FB;
      --white: #FFFFFF;
      --bg: #F5F6F8;
      --border: #E8ECF0;
      --text: #1A1A1A;
      --text-secondary: #888888;
      --disabled: #C0C4CC;
      --danger: #E8553D;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --shadow-sm: 0 2px 12px rgba(0,0,0,0.10);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.12);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      font-size: 12px;
      color: var(--text);
      background: var(--white);
      overflow: hidden;
      user-select: none;
    }

    /* ═══════════════════════════════════════
       收起态 — 浮标
       ═══════════════════════════════════════ */
    .badge {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: box-shadow 0.2s;
    }
    .badge:hover {
      box-shadow: var(--shadow-md);
    }
    .badge-icon {
      font-size: 22px;
      line-height: 1;
    }

    /* ═══════════════════════════════════════
       展开态 — 完整面板
       ═══════════════════════════════════════ */
    .panel {
      display: none;
      flex-direction: column;
      height: 100vh;
    }

    /* 标题栏 */
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
      padding: 0 16px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .panel-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .btn-collapse {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 16px;
      cursor: pointer;
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .btn-collapse:hover {
      background: var(--bg);
    }

    /* 工具栏 */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 16px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 28px;
      padding: 0 10px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--blue);
      color: var(--white);
    }
    .btn-primary:hover {
      background: var(--blue-hover);
    }
    .btn-secondary {
      background: var(--bg);
      color: var(--text);
    }
    .btn-secondary:hover {
      background: var(--border);
    }

    /* 备注列表 */
    .note-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      background: var(--bg);
    }
    .note-list-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-secondary);
      font-size: 12px;
    }

    /* 备注卡片 */
    .note-card {
      background: var(--white);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      border: 1px solid var(--border);
      transition: border-color 0.15s;
    }
    .note-card:hover {
      border-color: var(--blue-light);
    }
    .note-card.selected {
      border-color: var(--blue);
      border-left: 3px solid var(--blue);
    }
    .note-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px 0;
    }
    .note-number {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--blue);
      color: var(--white);
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .note-number.locked {
      background: var(--disabled);
    }
    .note-title {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .note-card-body {
      padding: 6px 12px 10px 40px;
    }
    .note-textarea {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 8px;
      font-size: 12px;
      font-family: var(--font);
      color: var(--text);
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
    }
    .note-textarea:focus {
      border-color: var(--blue);
    }
    .note-textarea::placeholder {
      color: var(--text-secondary);
    }

    /* 卡片操作按钮 */
    .note-card-actions {
      display: flex;
      gap: 4px;
      padding: 0 12px 10px 40px;
    }
    .btn-sm {
      height: 24px;
      padding: 0 8px;
      font-size: 11px;
      font-weight: 400;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-secondary);
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .btn-sm:hover {
      background: var(--border);
      color: var(--text);
    }
    .btn-sm.danger:hover {
      background: #FDE8E5;
      color: var(--danger);
    }

    /* 状态提示 */
    .status-bar {
      height: 28px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      font-size: 11px;
      color: var(--text-secondary);
      background: var(--white);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════
      收起态 — 小浮标
      ═══════════════════════════════════════ -->
  <div class="badge" id="badge">
    <span class="badge-icon">📌</span>
  </div>

  <!-- ═══════════════════════════════════════
      展开态 — 完整面板
      ═══════════════════════════════════════ -->
  <div class="panel" id="panel">
    <!-- 标题栏 -->
    <div class="panel-header">
      <span class="panel-title">📋 编号标注</span>
      <button class="btn-collapse" id="btnCollapse" title="收起">━</button>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar">
      <button class="btn btn-primary" id="btnAdd">+ 添加</button>
      <button class="btn btn-secondary" id="btnLockToggle">
        <span id="lockIcon">🔓</span> 锁定
      </button>
    </div>

    <!-- 备注列表 -->
    <div class="note-list" id="noteList">
      <div class="note-list-empty" id="emptyHint">
        暂无标注，点击「+ 添加」开始
      </div>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar" id="statusBar">
      标注数量: 0
    </div>
  </div>

  <!-- ═══════════════════════════════════════
      脚本
      ═══════════════════════════════════════ -->
  <script>
    // ── 状态 ──
    let isExpanded = false;
    let annotations = [];           // 当前标注列表
    let selectedAnnotationId = null; // 当前选中的编号点 ID

    // ── DOM 引用 ──
    const badge = document.getElementById('badge');
    const panel = document.getElementById('panel');
    const btnCollapse = document.getElementById('btnCollapse');
    const btnAdd = document.getElementById('btnAdd');
    const btnLockToggle = document.getElementById('btnLockToggle');
    const noteList = document.getElementById('noteList');
    const emptyHint = document.getElementById('emptyHint');
    const statusBar = document.getElementById('statusBar');

    // ── 通信 ──
    function sendToCode(msg) {
      parent.postMessage({ pluginMessage: msg }, '*');
    }

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;
      handleCodeMessage(msg);
    };

    function handleCodeMessage(msg) {
      switch (msg.type) {
        case 'panel-expanded':
          // 沙箱已调整到展开尺寸，切换 UI
          switchToPanel();
          break;
        case 'panel-collapsed':
          switchToBadge();
          break;
        case 'init':
          // 初始化数据
          if (msg.annotations) {
            annotations = msg.annotations;
            renderNoteList();
          }
          break;
        case 'annotation-added':
          annotations.push(msg.annotation);
          renderNoteList();
          break;
        case 'annotation-removed':
          annotations = annotations.filter(a => a.annotationId !== msg.annotationId);
          if (selectedAnnotationId === msg.annotationId) {
            selectedAnnotationId = null;
          }
          renderNoteList();
          break;
        case 'annotation-updated':
          const idx = annotations.findIndex(a => a.annotationId === msg.annotation.annotationId);
          if (idx >= 0) {
            annotations[idx] = msg.annotation;
            renderNoteList();
          }
          break;
        case 'annotations-renumbered':
          annotations = msg.annotations;
          renderNoteList();
          break;
        case 'annotation-selected':
          selectedAnnotationId = msg.annotationId;
          highlightSelectedCard();
          break;
        default:
          console.log('[ui] 未处理的消息:', msg.type);
      }
    }

    // ── 收起/展开切换 ──
    function switchToBadge() {
      isExpanded = false;
      badge.style.display = 'flex';
      panel.style.display = 'none';
    }

    function switchToPanel() {
      isExpanded = true;
      badge.style.display = 'none';
      panel.style.display = 'flex';
    }

    // ── 事件 ──
    badge.onclick = () => {
      sendToCode({ type: 'badge-clicked' });
    };

    btnCollapse.onclick = () => {
      sendToCode({ type: 'collapse-panel' });
    };

    btnAdd.onclick = () => {
      sendToCode({ type: 'add-annotation' });
    };

    btnLockToggle.onclick = () => {
      if (selectedAnnotationId) {
        sendToCode({ type: 'toggle-lock', annotationId: selectedAnnotationId });
      }
    };

    // ── 渲染 ──
    function renderNoteList() {
      noteList.innerHTML = '';

      if (annotations.length === 0) {
        noteList.innerHTML = '<div class="note-list-empty">暂无标注，点击「+ 添加」开始</div>';
      } else {
        annotations
          .sort((a, b) => a.order - b.order)
          .forEach(ann => {
            const card = createNoteCard(ann);
            noteList.appendChild(card);
          });
      }

      statusBar.textContent = `标注数量: ${annotations.length}`;
    }

    function createNoteCard(ann) {
      const card = document.createElement('div');
      card.className = 'note-card';
      card.dataset.annotationId = ann.annotationId;
      if (ann.annotationId === selectedAnnotationId) {
        card.classList.add('selected');
      }

      card.innerHTML = `
        <div class="note-card-header">
          <span class="note-number${ann.isLocked === 'true' ? ' locked' : ''}">${ann.order}</span>
          <span class="note-title">${ann.note || '(未备注)'}</span>
        </div>
        <div class="note-card-body">
          <textarea class="note-textarea"
                    placeholder="输入备注说明..."
                    data-id="${ann.annotationId}">${escapeHtml(ann.note || '')}</textarea>
        </div>
        <div class="note-card-actions">
          <button class="btn-sm" data-action="lock" data-id="${ann.annotationId}">
            ${ann.isLocked === 'true' ? '🔒 解锁' : '🔓 锁定'}
          </button>
          <button class="btn-sm" data-action="delete" data-id="${ann.annotationId}">
            🗑 删除
          </button>
          <button class="btn-sm" data-action="locate" data-id="${ann.annotationId}">
            📍 定位
          </button>
        </div>
      `;

      // 点击卡片选中
      card.onclick = (e) => {
        // 如果点击的是按钮或 textarea，不触发选中
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'TEXTAREA') return;
        sendToCode({ type: 'select-annotation', annotationId: ann.annotationId });
      };

      // 按钮事件
      card.querySelector('[data-action="lock"]').onclick = () => {
        sendToCode({ type: 'toggle-lock', annotationId: ann.annotationId });
      };
      card.querySelector('[data-action="delete"]').onclick = () => {
        sendToCode({ type: 'delete-annotation', annotationId: ann.annotationId });
      };
      card.querySelector('[data-action="locate"]').onclick = () => {
        sendToCode({ type: 'locate-annotation', annotationId: ann.annotationId });
      };

      // 文本编辑
      const textarea = card.querySelector('.note-textarea');
      textarea.oninput = () => {
        // 输入时实时同步
        sendToCode({
          type: 'update-note',
          annotationId: ann.annotationId,
          note: textarea.value,
        });
      };

      return card;
    }

    function highlightSelectedCard() {
      document.querySelectorAll('.note-card').forEach(card => {
        card.classList.toggle('selected', card.dataset.annotationId === selectedAnnotationId);
      });
      // 滚动到选中卡片
      const selected = document.querySelector('.note-card.selected');
      if (selected) {
        selected.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ── 键盘快捷键 ──
    document.addEventListener('keydown', (e) => {
      // 仅在面板展开时生效
      if (!isExpanded) return;

      const mod = e.ctrlKey || e.metaKey;

      // Ctrl/Cmd + Shift + A: 添加编号点
      if (mod && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
        e.preventDefault();
        sendToCode({ type: 'add-annotation' });
        return;
      }

      // Ctrl/Cmd + L: 锁定/解锁选中的编号点
      if (mod && (e.key === 'L' || e.key === 'l')) {
        e.preventDefault();
        if (selectedAnnotationId) {
          sendToCode({ type: 'toggle-lock', annotationId: selectedAnnotationId });
        }
        return;
      }

      // Delete / Backspace: 删除选中的编号点（仅在非输入框中）
      if (
        (e.key === 'Delete' || e.key === 'Backspace') &&
        selectedAnnotationId &&
        document.activeElement?.tagName !== 'TEXTAREA' &&
        document.activeElement?.tagName !== 'INPUT'
      ) {
        e.preventDefault();
        sendToCode({ type: 'delete-annotation', annotationId: selectedAnnotationId });
        return;
      }
    });

    // ── 初始状态 ──
    switchToBadge();
    console.log('[编号标注] UI 已就绪');
  </script>
</body>
</html>
