<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编号标注</title>
  <style>
    /* ═══════════════════════════════════════
       设计变量
       ═══════════════════════════════════════ */
    :root {
      /* 主色 */
      --blue: #4A90D9;
      --blue-hover: #3A7BC8;
      --blue-light: #EBF2FB;
      --white: #FFFFFF;
      --bg: #F5F6F8;
      --border: #E8ECF0;
      --text: #1A1A1A;
      --text-secondary: #888888;
      --disabled: #C0C4CC;
      --danger: #E8553D;
      --danger-bg: #FDE8E5;

      /* 圆角体系 */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;

      /* 阴影层次 */
      --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.10);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.14);

      /* 过渡 */
      --t-fast: 0.12s;
      --t-normal: 0.2s;

      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      font-size: 12px;
      color: var(--text);
      background: var(--white);
      overflow: hidden;
      user-select: none;
    }

    /* ═══════════════════════════════════════
       收起态 — 浮标
       ═══════════════════════════════════════ */
    .badge {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      cursor: pointer;
      transition: box-shadow var(--t-normal), transform var(--t-normal);
    }
    .badge:hover {
      box-shadow: var(--shadow-lg);
      transform: scale(1.05);
    }
    .badge-icon {
      font-size: 22px;
      line-height: 1;
    }

    /* ═══════════════════════════════════════
       展开态 — 完整面板
       ═══════════════════════════════════════ */
    .panel {
      display: none;
      flex-direction: column;
      height: 100vh;
    }

    /* ── 标题栏 ── */
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 46px;
      padding: 0 16px;
      background: linear-gradient(180deg, #FFFFFF, #FAFBFC);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .panel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .panel-title-icon {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: var(--blue-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .btn-collapse {
      background: none;
      border: 1px solid transparent;
      color: var(--text-secondary);
      font-size: 16px;
      cursor: pointer;
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--t-fast);
    }
    .btn-collapse:hover {
      background: var(--bg);
      color: var(--text);
      border-color: var(--border);
    }

    /* ── 工具栏 ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toolbar-divider {
      width: 1px;
      height: 22px;
      background: var(--border);
      margin: 0 2px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 30px;
      padding: 0 12px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      transition: all var(--t-fast);
      white-space: nowrap;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-primary {
      background: var(--blue);
      color: var(--white);
      box-shadow: 0 1px 3px rgba(74, 144, 217, 0.3);
    }
    .btn-primary:hover {
      background: var(--blue-hover);
      box-shadow: 0 2px 6px rgba(74, 144, 217, 0.4);
    }
    .btn-secondary {
      background: var(--bg);
      color: var(--text);
      border: 1px solid transparent;
    }
    .btn-secondary:hover {
      background: var(--blue-light);
      color: var(--blue);
      border-color: var(--blue-light);
    }
    /* 有选中编号点时：蓝色描边提示可操作 */
    .btn-secondary.has-selection {
      border-color: var(--blue);
    }
    /* 选中的编号点已锁定：实心高亮 */
    .btn-secondary.active {
      background: var(--blue);
      color: var(--white);
      border-color: var(--blue);
    }
    .btn-secondary.active:hover {
      background: var(--blue-hover);
      color: var(--white);
    }

    /* ── 设置面板（弹出） ── */
    .settings-panel {
      display: none;
      position: absolute;
      top: 92px;
      left: 12px;
      right: 12px;
      z-index: 150;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      padding: 12px;
    }
    .settings-panel.open {
      display: block;
      animation: slideDown 0.18s ease;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .settings-section {
      margin-bottom: 12px;
    }
    .settings-section:last-child {
      margin-bottom: 0;
    }
    .settings-section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--blue);
      margin-bottom: 8px;
    }
    .settings-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .settings-row:last-child {
      margin-bottom: 0;
    }
    .settings-label {
      width: 40px;
      font-size: 12px;
      color: var(--text);
      flex-shrink: 0;
    }
    .settings-num {
      background: var(--bg);
      border-radius: var(--radius-sm);
      padding: 3px 6px;
      height: 26px;
    }
    .settings-select {
      background: var(--bg);
      border-radius: var(--radius-sm);
      height: 26px;
      padding: 0 6px;
    }
    .palette-swatches {
      display: grid;
      grid-template-columns: repeat(6, 26px);
      gap: 6px;
    }
    .swatch {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform var(--t-fast), border-color var(--t-fast);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
    }
    .swatch:hover {
      transform: scale(1.15);
      border-color: var(--text-secondary);
    }
    .swatch.active {
      border-color: var(--text);
      transform: scale(1.08);
    }

    .num-input {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .num-input input {
      width: 30px;
      border: none;
      background: transparent;
      font-size: 11px;
      font-family: var(--font);
      color: var(--text);
      text-align: center;
      outline: none;
    }
    .num-input input::-webkit-outer-spin-button,
    .num-input input::-webkit-inner-spin-button {
      -webkit-appearance: none;
    }
    .num-input button {
      width: 16px;
      height: 16px;
      border: none;
      background: transparent;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      color: var(--text-secondary);
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: all var(--t-fast);
    }
    .num-input button:hover {
      color: var(--blue);
      background: var(--white);
      box-shadow: var(--shadow-sm);
    }
    .num-unit {
      font-size: 10px;
      color: var(--text-secondary);
      margin-left: 1px;
    }
    .tool-select {
      height: 26px;
      border: none;
      background: transparent;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-family: var(--font);
      color: var(--text);
      padding: 0 2px;
      outline: none;
      cursor: pointer;
    }
    .tool-select:hover {
      color: var(--blue);
    }

    /* ── 备注列表 ── */
    .note-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 12px 16px;
      background: var(--bg);
    }
    .note-list::-webkit-scrollbar {
      width: 5px;
    }
    .note-list::-webkit-scrollbar-thumb {
      background: #D3D8DE;
      border-radius: 4px;
    }
    .note-list::-webkit-scrollbar-thumb:hover {
      background: var(--disabled);
    }
    .note-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .note-list-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 10px;
      color: var(--text-secondary);
      font-size: 12px;
    }
    .empty-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--white);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .empty-title {
      font-weight: 500;
      color: var(--text);
    }
    .empty-hint {
      font-size: 11px;
      color: var(--text-secondary);
    }

    /* ── 备注卡片 ── */
    .note-card {
      background: var(--white);
      border-radius: var(--radius-md);
      margin-bottom: 10px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      transition: all var(--t-normal);
      position: relative;
      overflow: hidden;
    }
    .note-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--blue);
      opacity: 0;
      transition: opacity var(--t-normal);
    }
    .note-card:hover {
      border-color: #D8E4F5;
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }
    .note-card.selected {
      border-color: var(--blue);
      box-shadow: 0 0 0 1px rgba(74,144,217,0.15), var(--shadow-md);
    }
    .note-card.selected::before {
      opacity: 1;
    }

    .note-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 12px 0;
    }
    .note-number {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--blue);
      color: var(--white);
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 1px 3px rgba(74, 144, 217, 0.35);
    }
    .note-number.locked {
      background: var(--disabled);
      box-shadow: none;
    }
    .note-title {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .note-title.empty {
      color: var(--text-secondary);
      font-weight: 400;
    }
    .note-status-tag {
      font-size: 10px;
      color: var(--text-secondary);
      background: var(--bg);
      padding: 2px 8px;
      border-radius: 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .note-status-tag.linked {
      color: var(--blue);
      background: var(--blue-light);
    }

    .note-card-body {
      padding: 8px 12px 0 44px;
    }
    .note-textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-size: 12px;
      font-family: var(--font);
      color: var(--text);
      line-height: 1.5;
      resize: none;
      overflow: hidden;
      outline: none;
      background: #FAFBFC;
      transition: all var(--t-normal);
    }
    .note-textarea:hover {
      border-color: #D3D8DE;
    }
    .note-textarea:focus {
      border-color: var(--blue);
      background: var(--white);
      box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.12);
    }
    .note-textarea::placeholder {
      color: var(--text-secondary);
    }

    /* 卡片操作按钮 */
    .note-card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px 10px 44px;
      flex-wrap: wrap;
    }
    .btn-sm {
      height: 24px;
      padding: 0 9px;
      font-size: 11px;
      font-weight: 400;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-secondary);
      transition: all var(--t-fast);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-sm:hover {
      background: var(--blue-light);
      color: var(--blue);
    }
    .btn-sm:active {
      transform: scale(0.96);
    }
    .btn-sm.danger:hover {
      background: var(--danger-bg);
      color: var(--danger);
    }
    .actions-spacer {
      flex: 1;
    }

    /* ── 状态栏 ── */
    .status-bar {
      height: 30px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-secondary);
      background: var(--white);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .status-count {
      font-weight: 500;
      color: var(--blue);
    }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════
      收起态 — 小浮标
      ═══════════════════════════════════════ -->
  <div class="badge" id="badge">
    <span class="badge-icon">📌</span>
  </div>

  <!-- ═══════════════════════════════════════
      展开态 — 完整面板
      ═══════════════════════════════════════ -->
  <div class="panel" id="panel">
    <!-- 标题栏 -->
    <div class="panel-header">
      <span class="panel-title">
        <span class="panel-title-icon">📍</span>
        编号标注
      </span>
      <button class="btn-collapse" id="btnCollapse" title="收起">━</button>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar">
      <div class="toolbar-group">
        <button class="btn btn-primary" id="btnAdd" title="在选中图层左上角添加编号点">＋ 添加</button>
        <button class="btn btn-secondary" id="btnLockToggle" title="锁定/解锁选中的编号点">
          <span id="lockIcon">🔓</span> 锁定
        </button>
      </div>

      <div class="toolbar-divider"></div>

      <button class="btn btn-secondary" id="btnSettings" title="编号点样式与备注浮窗设置">
        ⚙ 设置
      </button>
    </div>

    <!-- 设置面板（弹出） -->
    <div class="settings-panel" id="settingsPanel">
      <div class="settings-section">
        <div class="settings-section-title">🎨 编号点样式</div>
        <div class="settings-row">
          <span class="settings-label">颜色</span>
          <div class="palette-swatches" id="swatches"></div>
        </div>
        <div class="settings-row">
          <span class="settings-label">大小</span>
          <div class="num-input settings-num">
            <button id="sizeMinus">−</button>
            <input type="number" id="sizeInput" min="12" max="60" />
            <button id="sizePlus">+</button>
            <span class="num-unit">px</span>
          </div>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-section-title">📏 备注浮窗</div>
        <div class="settings-row">
          <span class="settings-label">长度</span>
          <div class="num-input settings-num">
            <button id="charsMinus">−</button>
            <input type="number" id="charsInput" min="8" max="60" />
            <button id="charsPlus">+</button>
            <span class="num-unit">字/行</span>
          </div>
        </div>
        <div class="settings-row">
          <span class="settings-label">字号</span>
          <select class="tool-select settings-select" id="fontSizeSelect">
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12" selected>12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
            <option value="16">16</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 备注列表 -->
    <div class="note-list" id="noteList">
      <div class="note-list-empty" id="emptyHint">
        <div class="empty-icon">📍</div>
        <div class="empty-title">暂无标注</div>
        <div class="empty-hint">选中图层后点击「＋ 添加」开始</div>
      </div>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar" id="statusBar">
      <span>标注数量: <span class="status-count">0</span></span>
      <span class="status-hint">━ 收起</span>
    </div>
  </div>

  <!-- ═══════════════════════════════════════
      脚本
      ═══════════════════════════════════════ -->
  <script>
    // ── 状态 ──
    let isExpanded = false;
    let annotations = [];           // 当前标注列表
    let selectedAnnotationId = null; // 当前选中的编号点 ID
    let editingAnnotationId = null;  // 当前正在编辑输入的卡片 ID

    // 全局配置（颜色/尺寸/备注区域）
    let config = { color: '#4A90D9', size: 24, charsPerLine: 20, fontSize: 12 };

    // 预设色板（与 Figma 常用标注色一致）
    const PALETTE = [
      { name: '科技蓝', hex: '#4A90D9' },
      { name: '亮蓝', hex: '#3388FF' },
      { name: '青色', hex: '#00B8C4' },
      { name: '绿色', hex: '#3CB371' },
      { name: '橙色', hex: '#F5A623' },
      { name: '红色', hex: '#E8553D' },
      { name: '紫色', hex: '#8B5CF6' },
      { name: '粉色', hex: '#EC4899' },
      { name: '棕色', hex: '#8B5E3C' },
      { name: '灰色', hex: '#8899AA' },
      { name: '深蓝', hex: '#1E3A5F' },
      { name: '黑色', hex: '#333333' },
    ];

    // ── DOM 引用 ──
    const badge = document.getElementById('badge');
    const panel = document.getElementById('panel');
    const btnCollapse = document.getElementById('btnCollapse');
    const btnAdd = document.getElementById('btnAdd');
    const btnLockToggle = document.getElementById('btnLockToggle');
    const btnSettings = document.getElementById('btnSettings');
    const settingsPanel = document.getElementById('settingsPanel');
    const noteList = document.getElementById('noteList');
    const emptyHint = document.getElementById('emptyHint');
    const statusBar = document.getElementById('statusBar');
    const swatches = document.getElementById('swatches');
    const sizeInput = document.getElementById('sizeInput');
    const sizeMinus = document.getElementById('sizeMinus');
    const sizePlus = document.getElementById('sizePlus');
    const charsInput = document.getElementById('charsInput');
    const charsMinus = document.getElementById('charsMinus');
    const charsPlus = document.getElementById('charsPlus');
    const fontSizeSelect = document.getElementById('fontSizeSelect');

    // ── 通信 ──
    function sendToCode(msg) {
      parent.postMessage({ pluginMessage: msg }, '*');
    }

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;
      handleCodeMessage(msg);
    };

    function handleCodeMessage(msg) {
      switch (msg.type) {
        case 'panel-expanded':
          // 沙箱已调整到展开尺寸，切换 UI
          switchToPanel();
          break;
        case 'panel-collapsed':
          switchToBadge();
          break;
        case 'init':
          // 初始化数据（正在编辑输入时不重渲染，避免输入法中断）
          if (msg.annotations) {
            annotations = msg.annotations;
            if (editingAnnotationId === null) {
              renderNoteList();
            }
          }
          if (msg.config) {
            applyConfigFromCode(msg.config);
          }
          break;
        case 'config-updated':
          applyConfigFromCode(msg.config);
          break;
        case 'annotation-added':
          annotations.push(msg.annotation);
          renderNoteList();
          break;
        case 'annotation-removed':
          annotations = annotations.filter(a => a.annotationId !== msg.annotationId);
          if (selectedAnnotationId === msg.annotationId) {
            selectedAnnotationId = null;
          }
          renderNoteList();
          updateLockButton();
          break;
        case 'annotation-updated':
          const idx = annotations.findIndex(a => a.annotationId === msg.annotation.annotationId);
          if (idx >= 0) {
            annotations[idx] = msg.annotation;
            // 正在编辑的卡片不重渲染（避免输入框重建导致输入法中断）
            if (editingAnnotationId !== msg.annotation.annotationId) {
              renderNoteList();
            }
          }
          updateLockButton();
          break;
        case 'annotations-renumbered':
          annotations = msg.annotations;
          renderNoteList();
          break;
        case 'annotation-selected':
          selectedAnnotationId = msg.annotationId;
          highlightSelectedCard();
          updateLockButton();
          break;
        default:
          console.log('[ui] 未处理的消息:', msg.type);
      }
    }

    // ── 收起/展开切换 ──
    function switchToBadge() {
      isExpanded = false;
      badge.style.display = 'flex';
      panel.style.display = 'none';
    }

    function switchToPanel() {
      isExpanded = true;
      badge.style.display = 'none';
      panel.style.display = 'flex';
    }

    // ── 事件 ──
    badge.onclick = () => {
      sendToCode({ type: 'badge-clicked' });
    };

    btnCollapse.onclick = () => {
      sendToCode({ type: 'collapse-panel' });
    };

    btnAdd.onclick = () => {
      sendToCode({ type: 'add-annotation' });
    };

    btnLockToggle.onclick = () => {
      if (selectedAnnotationId) {
        sendToCode({ type: 'toggle-lock', annotationId: selectedAnnotationId });
      } else {
        showStatusHint('请先在画布上选中要锁定的编号点');
      }
    };

    // 状态栏临时提示
    let statusHintTimer = null;
    function showStatusHint(text) {
      const hintEl = statusBar.querySelector('.status-hint');
      if (!hintEl) return;
      hintEl.textContent = text;
      clearTimeout(statusHintTimer);
      statusHintTimer = setTimeout(() => {
        hintEl.textContent = '━ 收起';
      }, 2500);
    }

    // 根据选中编号点的锁定状态更新锁定按钮
    function updateLockButton() {
      const ann = annotations.find(a => a.annotationId === selectedAnnotationId);
      const locked = !!ann && ann.isLocked === 'true';
      btnLockToggle.querySelector('#lockIcon').textContent = locked ? '🔒' : '🔓';
      btnLockToggle.classList.toggle('active', !!ann && locked);
      btnLockToggle.classList.toggle('has-selection', !!ann);
    }

    // ── 全局配置控件（颜色/尺寸/备注区域） ──
    // hex → RGB 对象（Figma 0-1 范围）
    function hexToRgb(hex) {
      const h = hex.replace('#', '');
      return {
        r: parseInt(h.substring(0, 2), 16) / 255,
        g: parseInt(h.substring(2, 4), 16) / 255,
        b: parseInt(h.substring(4, 6), 16) / 255,
      };
    }

    // 发送配置更新
    function sendConfigUpdate() {
      sendToCode({
        type: 'update-config',
        config: {
          color: hexToRgb(config.color),
          size: config.size,
          charsPerLine: config.charsPerLine,
          fontSize: config.fontSize,
        },
      });
    }

    // 沙箱配置 → UI 显示（RGB → hex）
    function applyConfigFromCode(cfg) {
      if (!cfg) return;
      const toHex = (v) =>
        Math.round(v * 255).toString(16).padStart(2, '0');
      config = {
        color: cfg.color ? `#${toHex(cfg.color.r)}${toHex(cfg.color.g)}${toHex(cfg.color.b)}` : config.color,
        size: cfg.size ?? config.size,
        charsPerLine: cfg.charsPerLine ?? config.charsPerLine,
        fontSize: cfg.fontSize ?? config.fontSize,
      };
      syncConfigControls();
    }

    // 同步控件显示
    function syncConfigControls() {
      sizeInput.value = config.size;
      charsInput.value = config.charsPerLine;
      fontSizeSelect.value = String(config.fontSize);
      document.querySelectorAll('.swatch').forEach((el) => {
        el.classList.toggle('active', el.dataset.hex === config.color);
      });
    }

    // 渲染色板
    function renderPalette() {
      swatches.innerHTML = '';
      PALETTE.forEach((c) => {
        const el = document.createElement('div');
        el.className = 'swatch';
        el.dataset.hex = c.hex;
        el.style.background = c.hex;
        el.title = c.name;
        el.onclick = (e) => {
          e.stopPropagation();
          config.color = c.hex;
          syncConfigControls();
          sendConfigUpdate();
        };
        swatches.appendChild(el);
      });
      syncConfigControls();
    }

    // 设置面板开关（点击面板外关闭）
    btnSettings.onclick = (e) => {
      e.stopPropagation();
      settingsPanel.classList.toggle('open');
    };
    document.addEventListener('click', (e) => {
      if (!settingsPanel.contains(e.target)) {
        settingsPanel.classList.remove('open');
      }
    });

    // 尺寸输入（±按钮 + 数字输入）
    function adjustSize(delta) {
      config.size = Math.min(60, Math.max(12, config.size + delta));
      syncConfigControls();
      sendConfigUpdate();
    }
    sizeMinus.onclick = () => adjustSize(-2);
    sizePlus.onclick = () => adjustSize(2);
    sizeInput.onchange = () => {
      const v = parseInt(sizeInput.value, 10);
      config.size = isNaN(v) ? 24 : Math.min(60, Math.max(12, v));
      syncConfigControls();
      sendConfigUpdate();
    };

    // 每行字符数（±按钮 + 数字输入）
    function adjustChars(delta) {
      config.charsPerLine = Math.min(60, Math.max(8, config.charsPerLine + delta));
      syncConfigControls();
      sendConfigUpdate();
    }
    charsMinus.onclick = () => adjustChars(-1);
    charsPlus.onclick = () => adjustChars(1);
    charsInput.onchange = () => {
      const v = parseInt(charsInput.value, 10);
      config.charsPerLine = isNaN(v) ? 20 : Math.min(60, Math.max(8, v));
      syncConfigControls();
      sendConfigUpdate();
    };

    // 备注字号
    fontSizeSelect.onchange = () => {
      config.fontSize = parseInt(fontSizeSelect.value, 10);
      sendConfigUpdate();
    };

    // 渲染色板 + 同步显示
    renderPalette();

    // ── 渲染 ──
    function renderNoteList() {
      noteList.innerHTML = '';

      if (annotations.length === 0) {
        noteList.innerHTML = `
          <div class="note-list-empty">
            <div class="empty-icon">📍</div>
            <div class="empty-title">暂无标注</div>
            <div class="empty-hint">选中图层后点击「＋ 添加」开始</div>
          </div>`;
      } else {
        annotations
          .sort((a, b) => a.order - b.order)
          .forEach(ann => {
            const card = createNoteCard(ann);
            noteList.appendChild(card);
          });
      }

      statusBar.querySelector('.status-count').textContent = annotations.length;
    }

    function createNoteCard(ann) {
      const card = document.createElement('div');
      card.className = 'note-card';
      card.dataset.annotationId = ann.annotationId;
      if (ann.annotationId === selectedAnnotationId) {
        card.classList.add('selected');
      }

      card.innerHTML = `
        <div class="note-card-header">
          <span class="note-number${ann.isLocked === 'true' ? ' locked' : ''}">${ann.order}</span>
          <span class="note-title${ann.note ? '' : ' empty'}">${ann.note ? escapeHtml(ann.note) : '未备注'}</span>
          ${ann.isLocked === 'true'
            ? '<span class="note-status-tag">🔒 已锁定</span>'
            : ann.targetNodeId
              ? '<span class="note-status-tag linked">🔗 已关联</span>'
              : '<span class="note-status-tag">独立</span>'}
        </div>
        <div class="note-card-body">
          <textarea class="note-textarea"
                    placeholder="输入备注说明..."
                    data-id="${ann.annotationId}">${escapeHtml(ann.note || '')}</textarea>
        </div>
        <div class="note-card-actions">
          <button class="btn-sm" data-action="lock" data-id="${ann.annotationId}">
            ${ann.isLocked === 'true' ? '🔒 解锁' : '🔓 锁定'}
          </button>
          <button class="btn-sm" data-action="locate" data-id="${ann.annotationId}">
            📍 定位
          </button>
          <span class="actions-spacer"></span>
          <button class="btn-sm danger" data-action="delete" data-id="${ann.annotationId}">
            🗑 删除
          </button>
        </div>
      `;

      // 点击卡片选中
      card.onclick = (e) => {
        // 如果点击的是按钮或 textarea，不触发选中
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'TEXTAREA') return;
        sendToCode({ type: 'select-annotation', annotationId: ann.annotationId });
      };

      // 按钮事件
      card.querySelector('[data-action="lock"]').onclick = () => {
        sendToCode({ type: 'toggle-lock', annotationId: ann.annotationId });
      };
      card.querySelector('[data-action="delete"]').onclick = () => {
        sendToCode({ type: 'delete-annotation', annotationId: ann.annotationId });
      };
      card.querySelector('[data-action="locate"]').onclick = () => {
        sendToCode({ type: 'locate-annotation', annotationId: ann.annotationId });
      };

      // 文本编辑（防抖同步 + 自动增高 + 编辑中不重渲染）
      const textarea = card.querySelector('.note-textarea');
      const titleEl = card.querySelector('.note-title');
      const debouncedSave = debounce((value) => {
        sendToCode({ type: 'update-note', annotationId: ann.annotationId, note: value });
      }, 300);

      textarea.onfocus = () => {
        editingAnnotationId = ann.annotationId;
      };
      textarea.oninput = () => {
        // 本地更新数据（不触发全量重渲染，保证输入法正常组词）
        const target = annotations.find(a => a.annotationId === ann.annotationId);
        if (target) target.note = textarea.value;
        // 同步标题显示
        if (titleEl) {
          titleEl.textContent = textarea.value || '未备注';
          titleEl.classList.toggle('empty', !textarea.value);
        }
        // 自动增高
        autoGrowTextarea(textarea);
        // 防抖同步到沙箱
        debouncedSave(textarea.value);
      };
      textarea.onblur = () => {
        editingAnnotationId = null;
        // 失焦立即保存（防抖兜底）
        sendToCode({ type: 'update-note', annotationId: ann.annotationId, note: textarea.value });
      };

      // 初始设置一次高度（内容多时直接展开）
      autoGrowTextarea(textarea);

      return card;
    }

    // 防抖工具
    function debounce(fn, delay) {
      let timer = null;
      return function (...args) {
        clearTimeout(timer);
        timer = setTimeout(() => fn.apply(this, args), delay);
      };
    }

    // textarea 自动增高
    function autoGrowTextarea(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }

    function highlightSelectedCard() {
      document.querySelectorAll('.note-card').forEach(card => {
        card.classList.toggle('selected', card.dataset.annotationId === selectedAnnotationId);
      });
      // 滚动到选中卡片
      const selected = document.querySelector('.note-card.selected');
      if (selected) {
        selected.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ── 键盘快捷键 ──
    document.addEventListener('keydown', (e) => {
      // 仅在面板展开时生效
      if (!isExpanded) return;

      const mod = e.ctrlKey || e.metaKey;

      // Ctrl/Cmd + Shift + A: 添加编号点
      if (mod && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
        e.preventDefault();
        sendToCode({ type: 'add-annotation' });
        return;
      }

      // Ctrl/Cmd + L: 锁定/解锁选中的编号点
      if (mod && (e.key === 'L' || e.key === 'l')) {
        e.preventDefault();
        if (selectedAnnotationId) {
          sendToCode({ type: 'toggle-lock', annotationId: selectedAnnotationId });
        }
        return;
      }

      // Delete / Backspace: 删除选中的编号点（仅在非输入框中）
      if (
        (e.key === 'Delete' || e.key === 'Backspace') &&
        selectedAnnotationId &&
        document.activeElement?.tagName !== 'TEXTAREA' &&
        document.activeElement?.tagName !== 'INPUT'
      ) {
        e.preventDefault();
        sendToCode({ type: 'delete-annotation', annotationId: selectedAnnotationId });
        return;
      }
    });

    // ── 初始状态 ──
    switchToBadge();
    sendToCode({ type: 'ready' });
    console.log('[编号标注] UI 已就绪');
  </script>
</body>
</html>
